[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demand-forecast-optimizer"
version = "1.0.0"
description = "Multi-SKU demand forecasting (global XGBoost, recursive backtest vs. seasonal-naive baseline) with forecast-uncertainty-aware inventory optimization (safety stock, reorder point, EOQ), served over FastAPI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
